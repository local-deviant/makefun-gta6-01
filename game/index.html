<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISLA FORTUNA — A 3D Open-World Crime Story</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e18; font-family: Georgia, 'Times New Roman', serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; z-index: 5; }
  #hud.photo .hud-tl, #hud.photo .objective, #hud.photo .hud-tr, #hud.photo .police-list,
  #hud.photo .hud-bl, #hud.photo .hud-br, #hud.photo .toasts { display: none; }
  .panel { background: rgba(8,12,24,.62); border: 1px solid rgba(255,215,0,.35); border-radius: 8px; padding: 8px 12px; }
  .hud-tl { position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 6px; }
  .wanted { font-size: 26px; letter-spacing: 4px; text-shadow: 0 0 8px #000; }
  .wanted.hot { color: #ff5040; }
  .cash { font-size: 22px; font-weight: bold; color: #7dff8a; text-shadow: 0 1px 3px #000; }
  .respect { font-size: 13px; color: #ffd700; text-shadow: 0 1px 3px #000; }
  .objective { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 15px; color: #ffe970; text-shadow: 0 1px 3px #000; background: rgba(8,12,24,.55); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,215,0,.4); max-width: 46vw; text-align: center; }
  .race-standings { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); background: rgba(8,12,24,.72); border: 1px solid rgba(255,215,0,.5); border-radius: 8px; padding: 8px 14px; font-size: 14px; line-height: 1.5; text-align: center; }
  .race-standings b { color: #ffd700; }
  .hud-tr { position: absolute; top: 12px; right: 12px; text-align: right; display: flex; flex-direction: column; gap: 4px; }
  .clock { font-size: 24px; font-weight: bold; text-shadow: 0 1px 3px #000; }
  .day { font-size: 13px; color: #bcd; }
  .radio { font-size: 13px; color: #ff9ad5; }
  .police-list { position: absolute; top: 108px; right: 12px; display: flex; flex-direction: column; gap: 4px; }
  .punit { background: rgba(120,10,10,.72); border: 1px solid #ff4040; border-radius: 5px; padding: 4px 8px; font-size: 12px; }
  .punit b { color: #ffd700; }
  .hud-bl { position: absolute; left: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .minimap { width: 190px; height: 190px; border-radius: 50%; border: 2px solid rgba(255,215,0,.6); background: #0a1420; }
  .weapons { display: flex; gap: 6px; }
  .wslot { background: rgba(8,12,24,.7); border: 1px solid #567; border-radius: 5px; padding: 4px 8px; font-size: 12px; }
  .wslot.active { border-color: #ffd700; color: #ffd700; }
  .hud-br { position: absolute; right: 14px; bottom: 12px; text-align: right; }
  .speed { font-size: 52px; font-weight: bold; line-height: 1; text-shadow: 0 2px 8px #000; }
  .speed-unit { font-size: 13px; color: #bcd; }
  .veh { font-size: 14px; color: #ffd700; }
  .cond-wrap { width: 170px; height: 8px; background: rgba(0,0,0,.6); border: 1px solid #567; border-radius: 4px; margin: 4px 0 0 auto; overflow: hidden; display: none; }
  .cond { height: 100%; width: 100%; background: #2aff7a; }
  .toasts { position: absolute; bottom: 210px; left: 12px; display: flex; flex-direction: column; gap: 5px; }
  .toast { background: rgba(8,12,24,.78); border-left: 3px solid #ffd700; padding: 6px 10px; font-size: 13px; border-radius: 4px; max-width: 340px; transition: opacity .4s; }
  .dialog { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); display: none; width: min(680px, 72vw); background: rgba(8,12,24,.86); border: 1px solid #ffd700; border-radius: 10px; padding: 10px 14px; gap: 12px; align-items: flex-start; }
  .portrait { width: 96px; height: 96px; border-radius: 6px; flex-shrink: 0; }
  .dialog-body { flex: 1; }
  .dialog-name { color: #ffd700; font-weight: bold; font-size: 14px; margin-bottom: 4px; }
  .dialog-text { font-size: 15px; line-height: 1.45; }
  .dialog-hint { font-size: 11px; color: #9ab; margin-top: 6px; }
  .pause { position: absolute; inset: 0; background: rgba(6,10,20,.82); pointer-events: auto; display: none; padding: 40px; overflow: auto; }
  .pause-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .pause-tab { background: rgba(255,215,0,.12); border: 1px solid rgba(255,215,0,.5); color: #ffe970; font-size: 15px; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-family: inherit; }
  .pause-tab.active { background: #ffd700; color: #111; }
  .pause-body { max-width: 720px; color: #e8e8e8; }
  .pause-body h2 { color: #ffd700; margin-bottom: 10px; font-size: 26px; }
  .pause-body p { line-height: 1.6; margin-bottom: 12px; }
  .map-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; font-size: 14px; }
  .muted { color: #9ab; }
  .title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: linear-gradient(180deg, rgba(10,14,24,.25), rgba(10,14,24,.72)); pointer-events: auto; text-align: center; }
  .title-big { font-size: 64px; font-weight: bold; letter-spacing: 6px; color: #ffd700; text-shadow: 0 4px 24px #000; }
  .title-sub { font-size: 18px; color: #ffe970; }
  .title-help { font-size: 13px; color: #bcd; max-width: 640px; line-height: 1.6; }
  .title-btn { margin-top: 10px; background: #ffd700; color: #111; border: none; font-size: 20px; font-weight: bold; padding: 12px 34px; border-radius: 8px; cursor: pointer; font-family: inherit; }
  .title-btn:hover { background: #ffe970; }
</style>

{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>

<canvas id="game"></canvas>
<div id="hud"></div>

</html>
